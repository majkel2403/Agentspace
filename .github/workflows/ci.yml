name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Motion report (growth, camera, avatars, framing)
        run: npm run motion
      - name: Jarvis relay adapter tests
        run: node --test test/jarvis.test.mjs
      - name: Layout check (six window sizes, five states, real browser)
        run: |
          npm i -g playwright@1.47.2
          npx --yes playwright@1.47.2 install --with-deps chromium
          PORT=4777 node server/server.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4777/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE=$(npm root -g) node tools/layout-check.mjs
      - name: Demo runs are up to date with demo/make-demo.mjs
        run: npm run demo:build && git diff --exit-code demo/runs
      - name: Artifact boards are up to date with the core
        run: |
          node artifact/build-app.mjs
          node artifact/gourcify-main.mjs
          node artifact/check-board.mjs artifact/project/Hermes.dc.html --quiet
          node artifact/check-board.mjs artifact/project/HermesMobile.dc.html --quiet
          node artifact/check-board.mjs artifact/project/Main.dc.html --quiet
          git diff --exit-code artifact/project
