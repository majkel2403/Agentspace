<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ul · centrum roju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/public/styles.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="app">
  <header id="top" class="panel top"></header>
  <aside id="roster" class="panel roster" aria-label="Zespół"></aside>
  <main id="stage" class="stage" aria-label="Scena roju">
    <div id="curtain" class="curtain" aria-hidden="true"><span class="eyebrow">zlecenie</span><b id="curtain-task"></b><small id="curtain-who"></small></div>
    <form id="conduct" class="conduct" autocomplete="off">
      <span class="eyebrow">dyrygent</span>
      <input id="conduct-text" name="text" placeholder="skup szkielet, testuj, zatrzymaj…" aria-label="Polecenie dla roju" maxlength="200">
      <button class="btn" type="submit">Wyślij</button>
      <small id="conduct-note"></small>
    </form>
    <div class="legend"><span><i class="k-q"></i>królowa</span><span><i class="k-r"></i>czyta</span><span><i class="k-c"></i>nowy</span><span><i class="k-m"></i>zmiana</span><span><i class="k-x"></i>usunięty</span><span><i class="k-msg"></i>wiadomość</span></div>
  </main>
  <section id="deck" class="panel deck" aria-label="Pulpit"></section>
  <footer id="scrub" class="panel scrub-bar"></footer>
</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
